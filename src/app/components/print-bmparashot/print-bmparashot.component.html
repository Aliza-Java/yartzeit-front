<!-- Buttons -->
<div class="buttons-line">
    <div class="button-wrapper">
        <button (click)="downloadPdf()" class="py-2 text-white rounded">
            <i class="bi bi-file-earmark-pdf"></i> Download as PDF
        </button>
    </div>

    <div class="button-wrapper">
        <button (click)="downloadExcel()" class="py-2 text-white rounded">
            <i class="bi bi-file-earmark-excel"></i> Download as Excel
        </button>
    </div>
</div>

<div class="table-wrapper" *ngIf="bmparashot?.length">
    <table id="bmp-table" border="1" cellspacing="0" cellpadding="8">
        <thead>
            <tr>
                <th class="title-head" colspan="4" style="text-align: center;">Bar Mitzva Parashot</th>
            </tr>
            <tr>
                <th>Name</th>
                <th>Name for Aliya</th>
                <th>Bar Mitzva Parasha</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let b of bmparashot">
                <td>{{b.firstName}} {{b.lastName}}</td>
                <td>{{b.hebName}} ben {{b.fatherName}}</td>
                <td>{{b.parasha}}</td>
            </tr>
        </tbody>
    </table>
</div>
