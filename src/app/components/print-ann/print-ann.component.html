<!-- Buttons -->
<div class="buttons-line">
    <div class="button-wrapper">
        <button (click)="downloadPdf()" class="py-2 text-white rounded">
            <i class="bi bi-file-earmark-pdf"></i> Download as PDF
        </button>
    </div>

    <div class="button-wrapper">
        <button (click)="downloadExcel()" class="py-2 text-white rounded">
            <i class="bi bi-file-earmark-excel"></i> Download as Excel
        </button>
    </div>
</div>

<div class="table-wrapper" *ngIf="anniversaries?.length">
    <table id="ann-table" border="1" cellspacing="0" cellpadding="8">
        <thead>
            <tr>
                <th class="title-head" colspan="2" style="text-align: center;">Anniversaries</th>
            </tr>
            <tr>
                <th>Date</th>
                <th>Name</th>
        </thead>
        <tbody>
            <tr *ngFor="let a of anniversaries">
                <td>{{a.day}} {{a.month}}</td>
                <td>{{a.firstName}} & {{a.spouse}} {{a.lastName}}</td>
            </tr>
        </tbody>
    </table>
</div>
