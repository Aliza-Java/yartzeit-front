<div class="app-container">
    <!-- Sidebar -->
    <nav class="sidebar" *ngIf="showSidebar && sidebarReady">
        <ul>
            <li><a class="main-menu-item" routerLink="/generate" routerLinkActive="active">Generate Link</a></li>
            
            <li class="nav-submenu">
                <details>
                    <summary class="submenu-summary">Submit New</summary>
                    <ul class="submenu-list">
                        <li class="submenu-item"><a routerLink="/add-member" routerLinkActive="active">Member</a></li>
                        <li class="submenu-item"><a routerLink="/add-supporter" routerLinkActive="active">Supporter</a></li>
                    </ul>
                </details>
            </li>

            <li class="nav-submenu">
                <details>
                    <summary class="submenu-summary">List All</summary>
                    <ul class="submenu-list">
                        <li class="submenu-item"><a routerLink="/details-mem" routerLinkActive="active">Members</a></li>
                        <li class="submenu-item"><a routerLink="/details-sup" routerLinkActive="active">Supporters</a></li>
                    </ul>
                </details>
            </li>

            <li><a class="main-menu-item" routerLink="/print" routerLinkActive="active">Print Dates</a></li>
        </ul>
        <!--<div class="version-note">sep20</div>-->
    </nav>

    <!-- Main Content -->
    <main class="content">
        <router-outlet></router-outlet>
        <ngx-spinner class="local-spinner" bdColor="rgba(255,255,255,0.3)" size="large" color="#97c48e"
            type="ball-spin-clockwise-fade-rotating" [fullScreen]="true">
        </ngx-spinner>
    </main>
</div>
